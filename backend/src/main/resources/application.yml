server:
  port: 8080
  error:
    # 错误消息统一由 GlobalExceptionHandler 出口，不再泄漏底层异常详情
    include-message: never
spring:
  application:
    name: agentdesk-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 300MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentdesk}
    username: ${SPRING_DATASOURCE_USERNAME:agentdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:agentdesk}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8000}
  service-token: ${AGENT_SERVICE_TOKEN:}
  # 向量检索：留空禁用（纯 FTS）；配置如 embedding-3 后启用混合检索（维度 AGENT_EMBED_DIMENSIONS，默认 512 对齐 pgvector）
  embed-model: ${AGENT_EMBED_MODEL:}
security:
  jwt:
    # 必须通过环境变量 JWT_SECRET 提供（≥32 位随机值）；留空时 JwtService 启动即失败
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:28800}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:agentdesk}
  secret-key: ${MINIO_SECRET_KEY:agentdesk123}
